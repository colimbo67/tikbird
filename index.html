<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tikbird Simple</title>
<style>
  body { font-family: Arial; background:#111; color:white; text-align:center; padding:20px; }
  .box { background:#222; padding:20px; border-radius:10px; max-width:450px; margin:auto; }
  input, button { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:none; box-sizing:border-box; }
  button { background:#4ade80; font-weight:bold; cursor:pointer; }
  button.danger { background:#f87171; }
  button.small { width:auto; padding:5px 8px; font-size:12px; margin-left:5px; }
  img.post { max-width:100%; margin-top:10px; border-radius:10px; }
  img.avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:6px; }
  .small { font-size:14px; color:#ccc; text-align:left; }
  .post-item { text-align:left; margin-top:10px; padding:8px; background:#111; border-radius:8px; }
  hr { border:none; border-top:1px solid #444; margin:15px 0; }
</style>
</head>
<body>

<div class="box" id="loginBox">
  <h2>Tikbird</h2>
  <p>Solo para mi hermana y yo</p>

  <h3>Iniciar sesión</h3>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
  <p id="error" style="color:#f87171;"></p>

  <hr>

  <h3>Crear cuenta</h3>
  <input id="newUser" placeholder="Nuevo usuario">
  <input id="newPass" type="password" placeholder="Nueva contraseña">
  <input type="file" id="newAvatar" accept="image/*">
  <button onclick="crearCuenta()">Crear cuenta</button>
  <p class="small">El avatar lo sube cada usuario al crear su cuenta.</p>
</div>

<div class="box" id="appBox" style="display:none;">
  <h2>Bienvenido <span id="name"></span></h2>

  <div id="adminPanel" style="display:none; text-align:left; margin-top:10px;">
    <h3>Panel admin</h3>
    <p class="small">Solo tú (admin) ves esto: cuentas y contraseñas.</p>
    <div id="listaCuentas" class="small"></div>
  </div>

  <hr>

  <h3>Subir imagen</h3>
  <input type="file" id="imgInput" accept="image/*">
  <button onclick="subirImagen()">Subir imagen</button>

  <hr>

  <h3>Muro compartido</h3>
  <div id="muro"></div>

  <button class="danger" onclick="logout()">Cerrar sesión</button>
</div>

<script>
  const ADMIN_USER = "colimbo";
  const ADMIN_PASS = "7600";

  // Cuentas: { usuario: { pass, avatar } }
  let cuentas = JSON.parse(localStorage.getItem("tikCuentas") || "{}");

  // Si no hay nada, creamos solo el admin
  if (Object.keys(cuentas).length === 0) {
    cuentas[ADMIN_USER] = { pass: ADMIN_PASS, avatar: null };
    localStorage.setItem("tikCuentas", JSON.stringify(cuentas));
  }

  function guardarCuentas() {
    localStorage.setItem("tikCuentas", JSON.stringify(cuentas));
  }

  function esAdmin(u) {
    return u === ADMIN_USER;
  }

  function crearCuenta() {
    const u = newUser.value.trim();
    const p = newPass.value.trim();
    const file = newAvatar.files[0];

    if (!u || !p) {
      alert("Rellena usuario y contraseña");
      return;
    }
    if (cuentas[u]) {
      alert("Ese usuario ya existe");
      return;
    }

    if (!file) {
      cuentas[u] = { pass: p, avatar: null };
      guardarCuentas();
      newUser.value = "";
      newPass.value = "";
      newAvatar.value = "";
      alert("Cuenta creada");
      if (esAdmin(localStorage.getItem("tikUser"))) mostrarCuentasAdmin();
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      cuentas[u] = { pass: p, avatar: e.target.result };
      guardarCuentas();
      newUser.value = "";
      newPass.value = "";
      newAvatar.value = "";
      alert("Cuenta creada");
      if (esAdmin(localStorage.getItem("tikUser"))) mostrarCuentasAdmin();
    };
    reader.readAsDataURL(file);
  }

  function login() {
    const u = user.value.trim();
    const p = pass.value.trim();

    if (cuentas[u] && cuentas[u].pass === p) {
      localStorage.setItem("tikUser", u);
      mostrarApp();
    } else {
      error.textContent = "Datos incorrectos";
    }
  }

  function mostrarApp() {
    const u = localStorage.getItem("tikUser");
    if (!u) return;

    loginBox.style.display = "none";
    appBox.style.display = "block";
    name.textContent = u;

    if (esAdmin(u)) {
      adminPanel.style.display = "block";
      mostrarCuentasAdmin();
    } else {
      adminPanel.style.display = "none";
    }

    cargarMuro();
  }

  function logout() {
    localStorage.removeItem("tikUser");
    location.reload();
  }

  function mostrarCuentasAdmin() {
    listaCuentas.innerHTML = "";
    for (let u in cuentas) {
      const info = cuentas[u];
      const div = document.createElement("div");
      div.innerHTML =
        "<strong>" + u + "</strong> : " + info.pass +
        (u === ADMIN_USER ? " (admin)" : "") +
        " <button class='small danger' onclick=\"borrarCuenta('" + u + "')\">Borrar</button>";
      listaCuentas.appendChild(div);
    }
  }

  function borrarCuenta(u) {
    if (u === ADMIN_USER) {
      alert("No puedes borrar la cuenta admin");
      return;
    }
    if (!confirm("¿Borrar la cuenta " + u + "?")) return;
    delete cuentas[u];
    guardarCuentas();
    mostrarCuentasAdmin();
  }

  // Imágenes: array de { src, user }
  function subirImagen() {
    const file = imgInput.files[0];
    const u = localStorage.getItem("tikUser");
    if (!u) {
      alert("Inicia sesión");
      return;
    }
    if (!file) {
      alert("Elige una imagen");
      return;
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const lista = JSON.parse(localStorage.getItem("tikImgs") || "[]");
      lista.push({ src: e.target.result, user: u });
      localStorage.setItem("tikImgs", JSON.stringify(lista));
      imgInput.value = "";
      cargarMuro();
    };
    reader.readAsDataURL(file);
  }

  function borrarImagen(index) {
    const u = localStorage.getItem("tikUser");
    if (!esAdmin(u)) {
      alert("Solo el admin puede borrar imágenes");
      return;
    }
    const lista = JSON.parse(localStorage.getItem("tikImgs") || "[]");
    if (!lista[index]) return;
    if (!confirm("¿Borrar esta imagen?")) return;
    lista.splice(index, 1);
    localStorage.setItem("tikImgs", JSON.stringify(lista));
    cargarMuro();
  }

  function cargarMuro() {
    const lista = JSON.parse(localStorage.getItem("tikImgs") || "[]");
    const u = localStorage.getItem("tikUser");
    const admin = esAdmin(u);
    muro.innerHTML = "";

    lista.forEach((item, idx) => {
      const cont = document.createElement("div");
      cont.className = "post-item";

      const avatarSrc = cuentas[item.user] && cuentas[item.user].avatar
        ? cuentas[item.user].avatar
        : "";

      let headerHTML = "";
      if (avatarSrc) {
        headerHTML += "<img class='avatar' src='" + avatarSrc + "'>";
      } else {
        headerHTML += "<span style='display:inline-block;width:32px;height:32px;border-radius:50%;background:#444;line-height:32px;text-align:center;font-size:14px;margin-right:6px;'>" +
                      (item.user[0] || "?").toUpperCase() + "</span>";
      }
      headerHTML += "<strong>" + item.user + "</strong>";

      if (admin) {
        headerHTML += " <button class='small danger' onclick='borrarImagen(" + idx + ")'>Borrar</button>";
      }

      cont.innerHTML = headerHTML + "<br>";
      const img = document.createElement("img");
      img.className = "post";
      img.src = item.src;
      cont.appendChild(img);

      muro.prepend(cont);
    });
  }

  // Si ya estaba logueado
  mostrarApp();
</script>

</body>
</html>
